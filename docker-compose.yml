services:
  mongo:
    image: mongo:7
    volumes: [mongo-data:/data/db]
  server:
    build: ./server
    environment:
      MONGO_URL: mongodb://mongo:27017/smartfix
      NODE_ENV: production
      # Required: set JWT_SECRET (long random string) in .env. The server refuses to start in production without it.
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (copy .env.example)}
      # Admin account is only created when ADMIN_PASSWORD is set; demo accounts (password demo123) only when SEED_DEMO=true
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SEED_DEMO: ${SEED_DEMO:-false}
    ports: ["4000:4000"]
    depends_on: [mongo]
  client:
    build:
      context: ./client
      args:
        # URL the BROWSER uses to reach the API; change for a hosted deployment
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports: ["5173:80"]
    depends_on: [server]
volumes:
  mongo-data:
